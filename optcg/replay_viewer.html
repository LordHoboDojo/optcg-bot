<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Replay</title>
<style>
:root {
  --bg: #12151b; --panel: #1a1f27; --panel2: #222833; --line: #2e3542; --text: #e7eaf0; --dim: #8b93a3;
  --p0: #4fc3f7; --p1: #ffb74d; --gold: #f2c94c; --bad: #ef5350; --good: #66bb6a; --pick: #b388ff;
  --red: #d64545; --green: #2e9e5b; --blue: #3b6fd8; --purple: #8a4fd1; --black: #555b66; --yellow: #e0b400;
  --card: #f6f3ea; --cardText: #1d1d1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr 360px; grid-template-areas:
  "top top" "board side" "ctl ctl"; }
header { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .vs { color: var(--dim); }
header .result { margin-left: auto; font-weight: 600; }
.p0 { color: var(--p0); } .p1 { color: var(--p1); }

/* board */
#board { grid-area: board; overflow: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.side.turn { box-shadow: inset 0 0 0 1px var(--accent); }
.side.s0 { --accent: var(--p0); } .side.s1 { --accent: var(--p1); }
.info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; color: var(--dim); font-size: 13px; }
.info .who { color: var(--accent); font-weight: 600; font-size: 14px; }
.info b { color: var(--text); font-weight: 600; }
.lifebar, .donbar { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.lifecard { width: 13px; height: 18px; border-radius: 2px; background: linear-gradient(135deg, #7b2b2b, #3e1515); border: 1px solid #a14646; }
.lifecard.up { background: var(--gold); border-color: #fff3; cursor: pointer; }
.don { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); }
.don.rested { background: transparent; border: 1.5px solid #f2c94c88; }
.link { cursor: pointer; text-decoration: underline dotted; }
.field { display: flex; gap: 10px; align-items: center; min-height: 140px; }
.field .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.chars { display: flex; gap: 8px; flex-wrap: wrap; }
.hand { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; }
.hand .label, .field .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.empty { color: #5d6575; font-size: 12px; font-style: italic; }
.mid { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px; min-height: 34px; }
.phase { color: var(--dim); }
.battle { background: #3a1d22; border: 1px solid #7a3340; color: #ffd6dc; padding: 4px 12px; border-radius: 999px; font-weight: 600; }

/* cards */
.slot { width: 100px; height: 138px; display: flex; align-items: center; justify-content: center; flex: none; }
.card { width: 96px; height: 134px; border-radius: 8px; background: var(--card); color: var(--cardText); position: relative;
  overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .25s, box-shadow .2s;
  box-shadow: 0 1px 3px #0008; }
.card .stripe { height: 7px; flex: none; }
.card .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 5px 0; font-size: 10px; color: #666; }
.card .cost { width: 20px; height: 20px; border-radius: 50%; background: #222; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.card .cost.up { background: #2f6d33; } .card .cost.down { background: #8a2b2b; }
.card .name { padding: 3px 6px 0; font-weight: 700; font-size: 11.5px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 0 1 auto; min-height: 0; }
.card .bottom { flex: none; }
.card .bottom { margin-top: auto; padding: 0 6px 5px; }
.card .power { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.card .power.up { color: #1f7a2e; } .card .power.down { color: #b02a2a; }
.card .ctr { font-size: 10px; color: #6a5a00; font-weight: 700; }
.card .kw { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 2px; }
.card .kw span { font-size: 8.5px; background: #222; color: #fff; padding: 0 3px; border-radius: 3px; }
.card .donb { position: absolute; top: 9px; right: 4px; background: var(--gold); color: #3a2c00; font-weight: 800; font-size: 10px; padding: 1px 4px; border-radius: 4px; }
.card.rested { transform: rotate(90deg) scale(.72); filter: saturate(.55) brightness(.85); }
.card.leader { outline: 2px solid #0002; }
.card.small { width: 70px; height: 98px; } .card.small .name { font-size: 10px; } .card.small .power { font-size: 13px; }
.card.small .top { padding: 3px 4px 0; } .card.small .top .cat { display: none; } .card.small .name { -webkit-line-clamp: 2; padding: 2px 4px 0; }
.card.small .bottom { padding: 0 4px 4px; } .card.small .cost { width: 17px; height: 17px; font-size: 11px; }
.card.back { background: repeating-linear-gradient(45deg, #5a2323, #5a2323 6px, #4a1b1b 6px, #4a1b1b 12px); cursor: default; }
.card.picked { box-shadow: 0 0 0 3px var(--pick), 0 0 16px var(--pick); }
.card.attacker { box-shadow: 0 0 0 3px var(--bad), 0 0 16px var(--bad); }
.card.target { box-shadow: 0 0 0 3px #fff, 0 0 14px #fff8; }
.card.picked.attacker, .card.picked.target { box-shadow: 0 0 0 3px var(--pick), 0 0 0 6px var(--bad), 0 0 16px var(--bad); }
.card.new { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }

/* side panel */
aside { grid-area: side; border-left: 1px solid var(--line); overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 6px; font-weight: 600; }
.step { font-size: 22px; font-weight: 700; }
.step small { font-size: 13px; color: var(--dim); font-weight: 400; }
.events { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.events li { background: var(--panel2); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
.events li.turnline { background: transparent; color: var(--dim); padding: 2px 0; font-weight: 600; }
.decision .who { font-weight: 600; }
.opts { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.opts li { padding: 4px 8px; border-radius: 6px; color: var(--dim); font-size: 13px; border: 1px solid transparent; }
.opts li.chosen { color: var(--text); border-color: var(--pick); background: #b388ff1a; font-weight: 600; }
.opts li.chosen::before { content: "\2192  "; color: var(--pick); }
.detail { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.detail .title { font-weight: 700; font-size: 15px; }
.detail .meta { color: var(--dim); font-size: 12px; margin: 2px 0 6px; }
.detail p { margin: 4px 0; white-space: pre-wrap; }
.detail .un { color: var(--bad); font-size: 12px; }

/* controls */
#ctl { grid-area: ctl; display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
button, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; }
button:hover { border-color: #4a5466; }
button.primary { background: #3d4b66; min-width: 84px; }
#timeline { flex: 1; min-width: 160px; accent-color: var(--pick); }
label { color: var(--dim); display: inline-flex; gap: 5px; align-items: center; font-size: 13px; }
.keys { color: #5d6575; font-size: 12px; }

@media (max-width: 1000px) {
  body { grid-template-columns: 1fr; grid-template-areas: "top" "board" "side" "ctl"; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="result" id="result"></span>
</header>
<main id="board"></main>
<aside>
  <div>
    <div class="step" id="step"></div>
  </div>
  <section><h2>What happened</h2><ul class="events" id="events"></ul></section>
  <section class="decision" id="decision"></section>
  <section id="detail"></section>
</aside>
<div id="ctl">
  <button id="prevTurn" title="Previous turn (PageUp)">&#x23EE; Turn</button>
  <button id="prev" title="Previous (Left arrow)">&#x25C0;</button>
  <button id="play" class="primary" title="Play / pause (Space)">&#x25B6; Play</button>
  <button id="next" title="Next (Right arrow)">&#x25B6;</button>
  <button id="nextTurn" title="Next turn (PageDown)">Turn &#x23ED;</button>
  <input type="range" id="timeline" min="0" value="0">
  <label>Speed <select id="speed"><option value="2500">Slow</option><option value="1300" selected>Normal</option><option value="600">Fast</option><option value="200">Very fast</option></select></label>
  <label><input type="checkbox" id="eventsOnly" checked> Skip quiet steps</label>
  <label>Hands <select id="hands"><option value="both">Both</option><option value="0">Player 0 only</option><option value="1">Player 1 only</option><option value="none">Hidden</option></select></label>
  <span class="keys">&larr; &rarr; step &middot; space play</span>
</div>
<script>
const R = /*REPLAY_DATA*/null;
const F = R.frames, C = R.cards;
const COLORS = { red: "var(--red)", green: "var(--green)", blue: "var(--blue)", purple: "var(--purple)", black: "var(--black)", yellow: "var(--yellow)" };
let i = 0, timer = null, prevUids = new Set(), selected = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const pname = p => `<span class="p${p}">P${p} ${esc(R.players[p].leader)}</span>`;

function stripe(cols) {
  const c = cols.map(x => COLORS[x] || "#999");
  return c.length === 1 ? c[0] : `linear-gradient(90deg, ${c.map((x, k) => `${x} ${k * 100 / c.length}%, ${x} ${(k + 1) * 100 / c.length}%`).join(", ")})`;
}

function cardHTML(c, opts = {}) {
  const d = C[c.i], f = F[i];
  const cls = ["card"];
  if (opts.small) cls.push("small");
  if (d.cat === "Leader") cls.push("leader");
  if (c.r) cls.push("rested");
  if (f.d && f.d.hl.includes(c.u)) cls.push("picked");
  if (f.b && f.b[0] === c.u) cls.push("attacker");
  if (f.b && f.b[1] === c.u) cls.push("target");
  if (opts.field && !prevUids.has(c.u) && i > 0) cls.push("new");
  const costCls = c.c === undefined ? "" : c.c > d.cost ? "up" : c.c < d.cost ? "down" : "";
  const powBase = d.pow;
  const powCls = c.p === undefined ? "" : c.p > powBase ? "up" : c.p < powBase ? "down" : "";
  const cost = d.cat === "Leader" ? `<span>Life ${d.life}</span>` : `<span class="cost ${costCls}">${c.c ?? d.cost}</span>`;
  const kws = (c.k || []).map(k => `<span>${esc(k)}</span>`).join("");
  const ctr = c.x ? `<div class="ctr">${opts.small ? "" : "Counter "}+${c.x}</div>` : "";
  const power = c.p !== undefined ? `<div class="power ${powCls}">${c.p}</div>` : `<div class="ctr" style="color:#666">${esc(d.cat)}</div>`;
  return `<div class="slot" style="${opts.small ? "width:72px;height:100px" : ""}"><div class="${cls.join(" ")}" data-id="${esc(c.i)}" title="${esc(d.n)}">
    <div class="stripe" style="background:${stripe(d.col)}"></div>
    <div class="top">${cost}<span class="cat">${d.cat === "Leader" ? "" : esc(d.cat)}</span></div>
    ${c.n ? `<div class="donb">+${c.n}</div>` : ""}
    <div class="name">${esc(d.n)}</div>
    <div class="bottom">${kws ? `<div class="kw">${kws}</div>` : ""}${ctr}${power}</div>
  </div></div>`;
}

function backHTML() { return `<div class="slot" style="width:72px;height:100px"><div class="card small back"></div></div>`; }

function sideHTML(p, f) {
  const s = f.s[p], [da, dr, dd] = s.don;
  const life = s.life.map((id, k) => id ? `<span class="lifecard up" data-id="${esc(id)}" title="${esc(C[id].n)} (face-up)"></span>` : `<span class="lifecard"></span>`).join("");
  const dons = "<span class='don'></span>".repeat(da) + "<span class='don rested'></span>".repeat(dr);
  const top = s.trash.length ? ` &middot; top: <span class="link" data-id="${esc(s.trash[s.trash.length - 1])}">${esc(C[s.trash[s.trash.length - 1]].n)}</span>` : "";
  const info = `<div class="info"><span class="who">${pname(p)}${R.players[p].agent ? ` <span style="color:var(--dim);font-weight:400">(${esc(R.players[p].agent)})</span>` : ""}</span>
    <span>Life <b>${s.life.length}</b><span class="lifebar">${life}</span></span>
    <span>DON!! <b>${da}</b> active, <b>${dr}</b> rested<span class="donbar">${dons}</span> &middot; ${dd} left</span>
    <span>Deck <b>${s.deck}</b></span>
    <span><span class="link" data-trash="${p}">Trash <b>${s.trash.length}</b></span>${top}</span>
    <span>Hand <b>${s.H.length}</b></span></div>`;
  const chars = s.C.length ? s.C.map(c => cardHTML(c, { field: true })).join("") : `<span class="empty">No Characters</span>`;
  const field = `<div class="field">${cardHTML(s.L, { field: true })}${s.S ? cardHTML(s.S, { field: true }) : ""}<div class="sep"></div><div class="chars">${chars}</div></div>`;
  const handMode = $("hands").value;
  const showHand = handMode === "both" || handMode === String(p);
  const hand = `<div class="hand">${s.H.length ? s.H.map(c => showHand ? cardHTML(c, { small: true }) : backHTML()).join("") : `<span class="empty">Empty hand</span>`}</div>`;
  const parts = p === 1 ? [hand, info, field] : [field, info, hand];
  return `<section class="side s${p} ${f.tp === p && f.t > 0 ? "turn" : ""}">${parts.join("")}</section>`;
}

function render() {
  const f = F[i];
  const top = 1, bottom = 0;
  let mid = `<span class="phase">Turn <b>${f.t}</b> &middot; ${f.t ? pname(f.tp) + "'s turn" : "Setup"} &middot; ${esc(f.ph.replace(/_/g, " "))} phase</span>`;
  if (f.b) {
    const find = u => { for (const s of f.s) for (const c of [s.L, ...s.C]) if (c.u === u) return c; };
    const a = find(f.b[0]), t = find(f.b[1]);
    if (a && t) mid += `<span class="battle">Battle: ${esc(C[a.i].n)} (${a.p}) &rarr; ${esc(C[t.i].n)} (${t.p})</span>`;
  }
  $("board").innerHTML = sideHTML(top, f) + `<div class="mid">${mid}</div>` + sideHTML(bottom, f);

  $("step").innerHTML = `Step ${i + 1} <small>of ${F.length} &middot; turn ${f.t}</small>`;
  const lines = f.log.map(l => {
    const m = l.replace(/^\[T\d+\] /, "");
    return m.startsWith("---") ? `<li class="turnline">${esc(m.replace(/-+/g, "").trim())}</li>` : `<li>${esc(m)}</li>`;
  });
  $("events").innerHTML = lines.join("") || `<li class="turnline" style="font-weight:400">Nothing new since the last step</li>`;

  if (f.d) {
    const d = f.d;
    $("decision").innerHTML = `<h2>Decision</h2><div><span class="who">${pname(d.pl)}</span> &middot; ${esc(d.q || d.kind)}</div>
      <ul class="opts">${d.o.map((o, k) => `<li class="${k === d.pick ? "chosen" : ""}">${esc(o)}</li>`).join("")}</ul>`;
  } else {
    const w = R.winner;
    $("decision").innerHTML = `<h2>Game over</h2><div class="step" style="font-size:18px">${w === null ? "Draw" : pname(w) + " wins"}</div>`;
  }
  renderDetail();
  $("timeline").value = i;
  prevUids = new Set(f.s.flatMap(s => [s.L, s.S, ...s.C].filter(Boolean).map(c => c.u)));
}

function renderDetail() {
  if (!selected) { $("detail").innerHTML = `<h2>Card</h2><div class="empty">Click a card to read it.</div>`; return; }
  if (selected.trash !== undefined) {
    const t = F[i].s[selected.trash].trash;
    $("detail").innerHTML = `<h2>P${selected.trash} trash (${t.length})</h2><div class="detail">${t.length ? t.slice().reverse().map(id => `<div class="link" data-id="${esc(id)}">${esc(C[id].n)}</div>`).join("") : `<span class="empty">Empty</span>`}</div>`;
    return;
  }
  const d = C[selected.id];
  const stats = [d.cat, d.col.join("/")];
  if (d.cat === "Leader") stats.push(`Life ${d.life}`); else stats.push(`Cost ${d.cost}`);
  if (d.pow) stats.push(`${d.pow} power`);
  if (d.cnt) stats.push(`Counter +${d.cnt}`);
  $("detail").innerHTML = `<h2>Card</h2><div class="detail"><div class="title">${esc(d.n)} <span style="color:var(--dim);font-weight:400;font-size:12px">${esc(selected.id)}</span></div>
    <div class="meta">${esc(stats.join(" · "))}${d.ty.length ? "<br>" + esc(d.ty.join(" / ")) : ""}</div>
    ${d.txt ? `<p>${esc(d.txt)}</p>` : ""}${d.trg ? `<p>${esc(d.trg)}</p>` : ""}
    ${d.un.length ? `<p class="un">Not implemented: ${esc(d.un.join(" / "))}</p>` : ""}</div>`;
}

const quiet = k => F[k].log.length === 0 && k !== F.length - 1 && k !== 0;
function go(k) { i = Math.max(0, Math.min(F.length - 1, k)); render(); }
function step(dir) {
  let k = i + dir;
  if ($("eventsOnly").checked) while (k > 0 && k < F.length - 1 && quiet(k)) k += dir;
  go(k);
}
function jumpTurn(dir) {
  const t = F[i].t;
  let k = i;
  if (dir > 0) { while (k < F.length - 1 && F[k].t === t) k++; }
  else { while (k > 0 && F[k].t === t) k--; const t2 = F[k].t; while (k > 0 && F[k - 1].t === t2) k--; }
  go(k);
}
function play(on) {
  clearInterval(timer); timer = null;
  if (on && i < F.length - 1) timer = setInterval(() => { if (i >= F.length - 1) return play(false); step(1); }, +$("speed").value);
  $("play").innerHTML = timer ? "&#x23F8; Pause" : "&#x25B6; Play";
}

$("title").innerHTML = `${pname(0)} <span class="vs">vs</span> ${pname(1)} <span class="vs" style="font-weight:400;font-size:13px">&middot; seed ${R.seed}</span>`;
$("result").innerHTML = R.winner === null ? "Draw" : `${pname(R.winner)} wins in ${R.turns} turns`;
$("timeline").max = F.length - 1;
$("timeline").oninput = e => go(+e.target.value);
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("prevTurn").onclick = () => jumpTurn(-1);
$("nextTurn").onclick = () => jumpTurn(1);
$("play").onclick = () => play(!timer);
$("speed").onchange = () => timer && play(true);
$("hands").onchange = render;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-id], [data-trash]");
  if (!el) return;
  selected = el.dataset.trash !== undefined ? { trash: +el.dataset.trash } : { id: el.dataset.id };
  renderDetail();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  const k = { ArrowRight: () => step(1), ArrowLeft: () => step(-1), " ": () => play(!timer), Home: () => go(0), End: () => go(F.length - 1),
    PageDown: () => jumpTurn(1), PageUp: () => jumpTurn(-1) }[e.key];
  if (k) { e.preventDefault(); k(); }
});
render();
</script>
</body>
</html>
