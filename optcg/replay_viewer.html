<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Table</title>
<style>
:root {
  --ink: #f3f0e8; --dim: #b9b4a6; --faint: #7d786c;
  --panel: rgba(16, 19, 26, .88); --panel2: rgba(30, 35, 46, .95); --line: rgba(255, 255, 255, .12);
  --gold: #f4c542; --red: #ff4d4d; --green: #46e08a; --blue: #5cc8ff; --violet: #b98cff;
  --W: 92px; --H: 128px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #120d09; color: var(--ink);
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
#backdrop { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.08), rgba(0,0,0,.75) 78%), var(--table, #2a1b10) center / cover; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
.title { font-family: Impact, "Arial Narrow Bold", "Helvetica Neue", sans-serif; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

/* ------------------------------------------------ zones (cut from the official playmat) */
.zone { position: absolute; border-radius: 8px; overflow: hidden; background-color: rgba(20, 30, 50, .55); background-repeat: no-repeat;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 10px rgba(0,0,0,.45); transition: box-shadow .2s; }
.zone::after { content: ""; position: absolute; inset: 0; background: rgba(8,10,16,.5); }
.zone { filter: saturate(.75); }
.zone.top { transform: rotate(180deg); }
.zone .lbl { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); font-size: 15px; z-index: 1; }
.zone.drop { box-shadow: inset 0 0 0 3px var(--green), 0 0 26px rgba(70,224,138,.55); }
.mid-line { position: absolute; left: 330px; width: 940px; top: 469px; height: 2px; background: linear-gradient(90deg, transparent, rgba(244,197,66,.55), transparent); }

/* ------------------------------------------------ cards */
#cards { position: absolute; inset: 0; }
.card { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H);
  transition: transform .42s cubic-bezier(.2,.8,.2,1), opacity .35s; will-change: transform; }
.card .lift { position: absolute; inset: 0; transition: transform .18s ease-out; }
.card .face { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; background: #f2eee4; color: #1b1b1b;
  box-shadow: 0 3px 8px rgba(0,0,0,.6); transition: transform .35s ease, filter .3s, box-shadow .2s; }
.card .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .face .tx { position: absolute; inset: 0; padding: 6px; font-size: 11px; font-weight: 700; line-height: 1.15; display: flex; flex-direction: column; gap: 3px;
  border-top: 7px solid var(--stripe, #888); }
.card .face .tx small { font-weight: 400; color: #555; }
.card.rested .face { transform: rotate(90deg); filter: brightness(.78); }
.card.flip .face { transform: rotate(180deg); }
.card.don.rested .face { transform: rotate(90deg); filter: brightness(.55) saturate(.6); }
.card .badges { position: absolute; inset: 0; pointer-events: none; }
.pw { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; font-weight: 800; font-size: 14px;
  background: rgba(10,12,18,.92); border: 1px solid rgba(255,255,255,.25); color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pw.up { color: var(--green); border-color: rgba(70,224,138,.6); } .pw.down { color: var(--red); border-color: rgba(255,77,77,.6); }
.cst { position: absolute; left: -7px; top: -7px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px;
  border: 2px solid #fff; box-shadow: 0 1px 4px #000; }
.cst.up { background: #2a8a46; } .cst.down { background: #b83232; }
.dn { position: absolute; right: -8px; top: -8px; padding: 0 6px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-weight: 900; font-size: 12px;
  background: var(--gold); color: #3a2a00; box-shadow: 0 1px 4px #000; }
.tuck { position: absolute; width: 34%; height: 30%; right: -14%; border-radius: 3px; overflow: hidden; z-index: -1; box-shadow: 0 1px 3px #000; background: #c9a227; }
.tuck img { width: 100%; height: 100%; object-fit: cover; transform: rotate(90deg) scale(1.4); }
.kws { position: absolute; left: 2px; right: 2px; bottom: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.kws span { font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.75); color: #fff; border: 1px solid rgba(255,255,255,.3); }
.kws span.neg { background: rgba(160,30,30,.85); }
.cnt { position: absolute; right: -6px; bottom: -6px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; display: grid; place-items: center;
  font-weight: 900; font-size: 13px; background: rgba(10,12,18,.95); border: 1px solid rgba(255,255,255,.3); }
.ctr { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); padding: 0 7px; border-radius: 999px; font-weight: 900; font-size: 13px;
  background: var(--gold); color: #3a2a00; box-shadow: 0 0 10px rgba(244,197,66,.8); white-space: nowrap; }

.card.hand { cursor: grab; }
.card.hand:hover { z-index: 400 !important; }
.card.hand:hover .lift { transform: translateY(-58px) scale(1.32); }
.card.field:hover .lift { transform: scale(1.06); }
.card.dragging { transition: none; z-index: 900 !important; pointer-events: none; }
.card.dragging .lift { transform: scale(1.1) rotate(-3deg); }

.card.can .face { box-shadow: 0 0 0 3px var(--green), 0 0 18px rgba(70,224,138,.85); }
.card.aim .face { box-shadow: 0 0 0 3px var(--red), 0 0 20px rgba(255,77,77,.9); animation: aim 1s ease-in-out infinite alternate; }
.card.sel .face { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(244,197,66,.95); }
.card.attacker .face { box-shadow: 0 0 0 3px var(--red), 0 0 26px rgba(255,77,77,.95); }
.card.target .face { box-shadow: 0 0 0 3px #fff, 0 0 22px rgba(255,255,255,.85); }
.card.picked .face { box-shadow: 0 0 0 3px var(--violet), 0 0 20px rgba(185,140,255,.9); }
.card.can, .card.aim, .card.sel { cursor: pointer; }
@keyframes aim { to { box-shadow: 0 0 0 3px var(--red), 0 0 6px rgba(255,77,77,.5); } }

#arrows { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

/* ------------------------------------------------ panels */
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
#preview { left: 14px; top: 14px; width: 300px; bottom: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
#preview .big { width: 276px; height: 385px; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.04); display: grid; place-items: center; color: var(--faint);
  box-shadow: 0 8px 24px rgba(0,0,0,.6); flex: none; }
#preview .big img { width: 100%; height: 100%; object-fit: cover; }
#preview .info { overflow: auto; font-size: 13px; color: var(--dim); flex: 1; min-height: 0; }
#preview .info h3 { margin: 0 0 2px; color: var(--ink); font-size: 17px; }
#preview .info .meta { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
#preview .info p { margin: 0 0 6px; white-space: pre-wrap; color: var(--ink); }
#preview .info .un { color: #ff8a8a; font-size: 12px; }

#side { right: 14px; top: 14px; width: 282px; bottom: 14px; display: flex; flex-direction: column; overflow: hidden; }
#side .top { padding: 10px 12px 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#side .top .ttl { font-size: 12px; color: var(--faint); flex: 1; min-width: 100px; }
.btn { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: var(--ink); border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.btn:hover { background: rgba(255,255,255,.14); }
.btn.primary { background: linear-gradient(180deg, #f6d36a, #d79b17); color: #2a1d00; border-color: #f6d36a; font-weight: 800; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: rgba(255,77,77,.5); color: #ffb3b3; }
.btn:disabled { opacity: .45; cursor: default; }
.who-row { margin: 0 10px 6px; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid transparent; font-size: 12px; color: var(--dim); }
.who-row .nm { font-weight: 800; font-size: 14px; display: block; margin-bottom: 2px; }
.who-row b { color: var(--ink); }
.who-row.turn { border-color: rgba(244,197,66,.7); box-shadow: 0 0 12px rgba(244,197,66,.3); }
#prompt { margin-top: 4px; padding: 12px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
#prompt .who { font-size: 12px; letter-spacing: .08em; }
#prompt .who.me { color: var(--green); } #prompt .who.them { color: var(--blue); }
#prompt .q { font-size: 15px; font-weight: 600; }
#prompt .hint { font-size: 12px; color: var(--faint); }
#prompt .opts { display: flex; flex-direction: column; gap: 6px; }
#prompt .opts .btn { text-align: left; }
#prompt .more { font-size: 12px; color: var(--faint); cursor: pointer; text-decoration: underline dotted; }
#endturn { padding: 12px; font-size: 20px; border-radius: 12px; }
#log { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--dim); }
#log .t { color: var(--gold); font-weight: 700; margin-top: 6px; font-size: 12px; letter-spacing: .05em; }
#log .l.me { border-left: 2px solid var(--green); padding-left: 6px; } #log .l.them { border-left: 2px solid var(--blue); padding-left: 6px; }
#log .l.new { color: var(--ink); }
#hist { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
#hist input { flex: 1; min-width: 0; accent-color: var(--gold); }

#phase { position: absolute; left: 340px; top: 457px; padding: 3px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
#battle { position: absolute; left: 50%; top: 470px; transform: translate(-50%, -50%); padding: 6px 18px; border-radius: 999px; font-weight: 900; font-size: 22px;
  background: rgba(40, 8, 12, .92); border: 2px solid var(--red); box-shadow: 0 0 24px rgba(255,77,77,.6); display: none; gap: 14px; align-items: center; z-index: 600; pointer-events: none; }
#battle .vs { color: var(--red); font-size: 14px; }
#battle .win { color: var(--green); } #battle .lose { color: #ffb3b3; }

#pop { position: absolute; z-index: 800; display: none; flex-direction: column; gap: 4px; padding: 6px; min-width: 200px; max-width: 320px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
#pop .btn { text-align: left; }
#banner { position: absolute; left: 330px; right: 330px; top: 420px; text-align: center; font-size: 72px; pointer-events: none; opacity: 0; z-index: 700;
  text-shadow: 0 4px 20px #000, 0 0 30px rgba(244,197,66,.5); color: var(--gold); transition: opacity .35s, transform .35s; transform: scale(.9); }
#banner.show { opacity: 1; transform: scale(1); }
#toast { position: absolute; left: 800px; top: 492px; transform: translateX(-50%); max-width: 760px; padding: 8px 18px; border-radius: 12px; background: rgba(10,12,18,.92);
  border: 1px solid var(--line); font-size: 15px; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 650; text-align: center; }
#toast.show { opacity: 1; }
#modal { position: absolute; inset: 0; z-index: 950; display: none; place-items: center; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
#modal .box { min-width: 420px; max-width: 1180px; padding: 22px 26px; border-radius: 18px; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.7);
  display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
#modal h2 { margin: 0; font-size: 30px; color: var(--gold); }
#modal .q { color: var(--dim); font-size: 15px; max-width: 760px; }
#modal .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-height: 600px; overflow: auto; padding: 8px; }
#modal .pick { width: 150px; display: flex; flex-direction: column; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; color: var(--dim); }
#modal .pick .im { position: relative; width: 150px; height: 209px; border-radius: 9px; overflow: hidden; background: #f2eee4; color: #222; box-shadow: 0 6px 16px rgba(0,0,0,.6);
  transition: transform .15s, box-shadow .15s; display: grid; place-items: center; padding: 8px; font-weight: 700; }
#modal .pick .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#modal .pick:hover .im { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--gold), 0 10px 24px rgba(0,0,0,.7); }
#modal .pick.off { cursor: default; } #modal .pick.off:hover .im { transform: none; box-shadow: 0 6px 16px rgba(0,0,0,.6); }
#modal .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#modal .btns .btn { padding: 10px 18px; font-size: 15px; }
#modal .btn.big { padding: 12px 26px; font-size: 18px; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="stage">
  <div id="zones"></div>
  <div class="mid-line"></div>
  <div id="phase"></div>
  <div id="cards"></div>
  <svg id="arrows" viewBox="0 0 1600 1000"><defs>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/></marker>
    <marker id="headg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4c542"/></marker>
  </defs></svg>
  <div id="battle"></div>
  <div id="toast"></div>
  <div id="banner" class="title"></div>

  <div class="panel" id="preview"><div class="big" id="pvImg">Hover a card</div><div class="info" id="pvInfo"></div></div>
  <div class="panel" id="side">
    <div class="top"><span class="ttl" id="ttl"></span><span id="liveBtns" hidden><button class="btn danger" id="concede">Concede</button> <button class="btn" id="newgame">New game</button></span></div>
    <div class="who-row" id="plate1"></div>
    <div class="who-row" id="plate0"></div>
    <div id="prompt"></div>
    <div id="log"></div>
    <div id="hist">
      <button class="btn" id="hBack" title="Step back (←)">◀</button>
      <button class="btn" id="hPlay" title="Play / pause (space)">▶</button>
      <button class="btn" id="hFwd" title="Step forward (→)">▶▏</button>
      <input type="range" id="hBar" min="0" value="0" aria-label="Timeline">
      <button class="btn" id="hLive" title="Back to the present (End)">Now</button>
    </div>
  </div>
  <div id="pop"></div>
  <div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
const R = /*REPLAY_DATA*/null;
const F = R.frames, C = R.cards, A = R.art || null;
const LIVE = R.live || null;
const BOT = LIVE ? LIVE.human : 0;     // the seat at the bottom of the table
const W = 92, H = 128, CX = 800, MY = 470;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const asset = p => A && p ? encodeURI(A.base + "/" + p) : null;
const art = id => asset(A && A.cards && A.cards[id]);
const short = p => R.players[p].leader.replace(/^\(.*?\)\s*/, "");
const COLORS = { red: "#d64545", green: "#2e9e5b", blue: "#3b6fd8", purple: "#8a4fd1", black: "#444", yellow: "#e0b400" };

let i = 0;                       // the frame on the table
let shownFrame = null;           // the frame drawn last, for animating from
let timer = null, busy = false, playing = null;
let ui = { mode: null, src: null };   // targeting: "attack" (src = attacker) or "don"

// ------------------------------------------------------------------ layout

const mine = p => p === BOT;
const pt = (p, x, y) => mine(p) ? [x, y] : [2 * CX - x, 2 * MY - y];   // the opponent sits across the table
const SLOT_X = [500, 650, 800, 950, 1100];
const POS = { leader: [800, 690], stage: [950, 690], deck: [1230, 690], life: [380, 690], dondeck: [380, 798], trash: [1230, 812], hand: [800, 924] };

// Zones cut from the official playmat: [x, y, w, h] in its 1414 x 1000 image.
const MAT = { chars: [190, 38, 1190, 284], leader: [705, 360, 198, 278], stage: [940, 360, 198, 278], deck: [1175, 360, 198, 278],
  dondeck: [42, 682, 192, 268], cost: [272, 665, 871, 302], trash: [1178, 682, 192, 268] };
const ZONES = [
  ["chars", 800, 544, 760, 142, "Character Area"], ["leader", 800, 690, 104, 142, "Leader"], ["stage", 950, 690, 104, 142, "Stage"],
  ["deck", 1230, 690, 104, 142, "Deck"], ["life", 380, 690, 112, 142, "Life"], ["dondeck", 380, 798, 72, 64, "DON!!"],
  ["cost", 805, 798, 676, 64, "Cost Area"], ["trash", 1230, 812, 80, 104, "Trash"]];

function drawZones() {
  let html = "";
  for (const p of [0, 1]) {
    const mat = A && A.mats ? asset(A.mats[p]) : null;
    for (const [name, x0, y0, w, h, label] of ZONES) {
      const [x, y] = pt(p, x0, y0);
      let bg = "";
      if (mat && MAT[name]) {
        const [mx, my, mw, mh] = MAT[name];
        const s = Math.max(w / mw, h / mh);
        bg = `background-image:url('${mat}');background-size:${1414 * s}px ${1000 * s}px;` +
             `background-position:${-(mx * s + (mw * s - w) / 2)}px ${-(my * s + (mh * s - h) / 2)}px;`;
      }
      const lbl = mat && MAT[name] ? "" : `<div class="lbl title">${label}</div>`;
      html += `<div class="zone ${mine(p) ? "" : "top"}" data-zone="${name}:${p}" style="left:${x - w / 2}px;top:${y - h / 2}px;width:${w}px;height:${h}px;${bg}">${lbl}</div>`;
    }
  }
  $("zones").innerHTML = html;
}

/** Every card on the table in frame f: where it goes and what it shows. */
function layout(f) {
  const out = [];
  const add = o => out.push(o);
  for (const p of [0, 1]) {
    const s = f.s[p];
    const at = (x, y) => pt(p, x, y);
    s.C.forEach((c, k) => { const [x, y] = at(SLOT_X[k] ?? 1100, 544); add({ key: "u" + c.u, c, p, x, y, s: 1, z: 20, zone: "char" }); });
    { const [x, y] = at(...POS.leader); add({ key: "u" + s.L.u, c: s.L, p, x, y, s: 1, z: 20, zone: "leader" }); }
    if (s.S) { const [x, y] = at(...POS.stage); add({ key: "u" + s.S.u, c: s.S, p, x, y, s: 1, z: 20, zone: "stage" }); }
    // Life: a stack of sideways cards; the top one (next to be taken) is drawn highest
    const n = s.life.length, step = n > 1 ? Math.min(16, 84 / (n - 1)) : 0;
    s.life.forEach((id, k) => {
      const [x, y] = at(380, 690 + ((n - 1) / 2 - k) * step);
      add({ key: `life${p}:${k}`, id, back: !id, p, x, y, s: .6, z: 5 + k, zone: "life" });
    });
    // DON!! in the cost area: active first, then rested
    const [da, dr, dd] = s.don, nd = da + dr, dstep = nd > 1 ? Math.min(48, 600 / (nd - 1)) : 0;
    for (let k = 0; k < nd; k++) {
      const [x, y] = at(500 + k * dstep, 798);
      add({ key: `don${p}:${k}`, don: true, rested: k >= da, p, x, y, s: .45, z: 6 + k, zone: "cost" });
    }
    if (s.deck) { const [x, y] = at(...POS.deck); add({ key: `deck${p}`, back: true, pile: s.deck, p, x, y, s: 1, z: 4, zone: "deck" }); }
    { const [x, y] = at(...POS.dondeck); add({ key: `dondeck${p}`, donback: true, pile: dd, p, x, y, s: .45, z: 4, zone: "dondeck" }); }
    if (s.trash.length) { const [x, y] = at(...POS.trash);
      add({ key: `trash${p}`, id: s.trash[s.trash.length - 1], pile: s.trash.length, p, x, y, s: .75, z: 4, zone: "trash" }); }
    // hands: yours fanned along the bottom edge, the opponent's peeking in at the top
    const hn = s.H.length, faceUp = s.H.some(c => c.u !== undefined);
    const scale = mine(p) ? 1.15 : (faceUp ? .78 : .6);
    const spread = mine(p) ? 600 : 460, pitch = mine(p) ? 112 : (faceUp ? 76 : 60);
    const hstep = hn > 1 ? Math.min(pitch, spread / (hn - 1)) : 0;
    s.H.forEach((c, k) => {
      const off = k - (hn - 1) / 2;
      const x = CX + (mine(p) ? off : -off) * hstep;
      const y = mine(p) ? 924 + off * off * 1.2 : (faceUp ? 56 : 34);
      if (c.u !== undefined) add({ key: "u" + c.u, c, p, x, y, s: scale, rot: mine(p) ? off * 1.6 : 0, z: 100 + k, zone: "hand" });
      else add({ key: `oh${p}:${k}`, back: true, flip: true, p, x, y, s: scale, z: 100 + k, zone: "ohand" });
    });
  }
  return out;
}

// ------------------------------------------------------------------ drawing cards

const els = new Map();
function img(src) { return src ? `<img src="${src}" alt="" draggable="false" onerror="this.remove()">` : ""; }

function faceHTML(it) {
  if (it.don) return img(asset(A && A.don)) || `<div class="tx" style="background:#f4c542;border:0">DON!!</div>`;
  if (it.donback) return img(asset(A && (A.donBack || A.don))) || `<div class="tx" style="background:#8a6d1a;border:0">DON!!</div>`;
  if (it.empty) return `<div class="tx" style="background:rgba(0,0,0,.2);border:0"></div>`;
  if (it.back) return img(asset(A && A.back)) || `<div class="tx" style="background:repeating-linear-gradient(45deg,#5a2323,#5a2323 6px,#4a1b1b 6px,#4a1b1b 12px);border:0"></div>`;
  const id = it.c ? it.c.i : it.id, d = C[id];
  const stripe = (d.col || []).map(c => COLORS[c] || "#999")[0] || "#999";
  return `<div class="tx" style="--stripe:${stripe}">${esc(d.n)}<small>${esc(d.cat)}${d.cat === "Leader" ? "" : " · cost " + d.cost}</small></div>` + img(art(id));
}

function badgesHTML(it, ctr) {
  let h = "";
  if (it.pile !== undefined && it.pile > 0) h += `<div class="cnt">${it.pile}</div>`;
  const c = it.c;
  if (!c) return h;
  const d = C[c.i];
  if (it.zone === "char" || it.zone === "leader") {
    h += `<div class="pw ${c.p > d.pow ? "up" : c.p < d.pow ? "down" : ""}">${c.p}</div>`;
    if (c.n) h += `<div class="dn">+${c.n}</div>`;
    for (let k = 0; k < Math.min(3, c.n || 0); k++) h += `<div class="tuck" style="bottom:${6 + k * 9}%">${img(asset(A && A.don))}</div>`;
  }
  if (c.c !== undefined && d.cat !== "Leader" && c.c !== d.cost) h += `<div class="cst ${c.c > d.cost ? "up" : "down"}">${c.c}</div>`;
  if (c.k && c.k.length && it.zone !== "hand") h += `<div class="kws">${c.k.map(k => `<span class="${k === "Can't attack" ? "neg" : ""}">${esc(k)}</span>`).join("")}</div>`;
  if (ctr) h += `<div class="ctr">+${ctr}</div>`;
  return h;
}

const xf = it => `translate(${it.x - W / 2}px, ${it.y - H / 2}px) scale(${it.s})`;
const sig = it => [it.c ? it.c.i : it.id, it.back, it.don, it.donback, it.empty].join("|");

function render(animate = true) {
  const f = F[i], prev = shownFrame;
  const marks = interactionMarks(f);
  const origin = originFinder(prev, f);
  const seen = new Set();
  for (const it of layout(f)) {
    seen.add(it.key);
    let el = els.get(it.key), fresh = false;
    if (!el) {
      fresh = true;
      el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="lift"><div class="face"></div><div class="badges"></div></div>`;
      $("cards").appendChild(el);
      els.set(it.key, el);
    }
    el._it = it;
    const face = el.querySelector(".face");
    if (el._sig !== sig(it)) { face.innerHTML = faceHTML(it); el._sig = sig(it); }
    const u = it.c ? it.c.u : null;
    const m = (u !== null && marks.get(u)) || "";
    const ctr = m.startsWith("ctr:") ? +m.slice(4) : 0;
    el.querySelector(".badges").innerHTML = badgesHTML(it, ctr);
    const cls = ["card"];
    if (it.zone === "hand") cls.push("hand");
    if (it.zone === "char" || it.zone === "leader" || it.zone === "stage") cls.push("field");
    if (it.don) cls.push("don");
    if (it.flip) cls.push("flip");
    if ((it.c && it.c.r && it.zone !== "hand") || (it.don && it.rested) || it.zone === "life") cls.push("rested");
    if (m) cls.push(ctr ? "can" : m);
    if (f.b && u !== null) { if (f.b[0] === u) cls.push("attacker"); if (f.b[1] === u) cls.push("target"); }
    if (f.d && f.d.pick !== null && u !== null && f.d.hl.includes(u)) cls.push("picked");
    if (it.don && ui.mode === "don" && it.p === BOT && !it.rested) cls.push("sel");
    if (ui.mode === "attack" && u === ui.src) cls.push("sel");
    el.className = cls.join(" ");
    face.style.transform = it.zone === "hand" && it.rot ? `rotate(${it.rot}deg)` : "";
    el.style.zIndex = it.z;
    if (fresh && animate && prev) {
      const o = origin(it);
      if (o) {
        el.style.transition = "none";
        el.style.transform = `translate(${o[0] - W / 2}px, ${o[1] - H / 2}px) scale(${it.s * .9})`;
        el.style.opacity = "0";
        el.getBoundingClientRect();
        el.style.transition = "";
      }
    }
    el.style.transform = xf(it);
    el.style.opacity = "1";
    el.style.pointerEvents = "";
  }
  for (const [k, el] of els) {
    if (seen.has(k)) continue;
    els.delete(k);
    const dest = animate && prev ? destination(el._it, prev, f) : null;
    if (dest) el.style.transform = `translate(${dest[0] - W / 2}px, ${dest[1] - H / 2}px) scale(${el._it.s * .8})`;
    el.style.opacity = "0";
    el.style.pointerEvents = "none";
    setTimeout(() => el.remove(), animate ? 450 : 0);
  }
  shownFrame = f;
  drawArrows();
  drawBattle(f);
  drawPanels(f);
}

/** Where a card that just appeared came from. */
function originFinder(prev, f) {
  if (!prev) return () => null;
  return it => {
    const p = it.p, s0 = prev.s[p], s1 = f.s[p];
    if (it.zone === "hand" || it.zone === "ohand") return s1.life.length < s0.life.length ? pt(p, ...POS.life) : pt(p, ...POS.deck);
    if (it.zone === "char" || it.zone === "stage") {
      if (s1.H.length < s0.H.length) return pt(p, ...POS.hand);
      if (s1.trash.length < s0.trash.length) return pt(p, ...POS.trash);
      return pt(p, ...POS.deck);
    }
    if (it.zone === "life") return s1.H.length < s0.H.length ? pt(p, ...POS.hand) : pt(p, ...POS.deck);
    if (it.don) return pt(p, ...POS.dondeck);
    return null;
  };
}

/** Where a card that just left went. */
function destination(it, prev, f) {
  const p = it.p, s0 = prev.s[p], s1 = f.s[p];
  if (it.don) {
    for (const c of [s1.L, ...s1.C]) {
      const was = [s0.L, ...s0.C].find(x => x.u === c.u);
      const el = els.get("u" + c.u);
      if (el && (c.n || 0) > ((was && was.n) || 0)) return [el._it.x, el._it.y];
    }
    return pt(p, ...POS.dondeck);
  }
  if (s1.trash.length > s0.trash.length) return pt(p, ...POS.trash);
  if (s1.H.length > s0.H.length) return pt(p, ...POS.hand);
  if (s1.life.length > s0.life.length) return pt(p, ...POS.life);
  return pt(p, ...POS.deck);
}

// ------------------------------------------------------------------ arrows and the battle readout

function center(u) { const el = els.get("u" + u); return el ? [el._it.x, el._it.y] : null; }
function arrowPath([x1, y1], [x2, y2]) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - Math.min(90, Math.abs(x2 - x1) * .25 + 30);
  return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
}

let dragArrow = null;    // [from, to, gold] while dragging an attack or a DON!!
function drawArrows() {
  const svg = $("arrows");
  svg.querySelectorAll("path.arr").forEach(p => p.remove());
  const add = (a, b, gold) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("class", "arr");
    p.setAttribute("d", arrowPath(a, b));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", gold ? "#f4c542" : "#ff4d4d");
    p.setAttribute("stroke-width", "7");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-dasharray", "2 14");
    p.setAttribute("marker-end", gold ? "url(#headg)" : "url(#head)");
    p.style.filter = "drop-shadow(0 0 6px rgba(0,0,0,.85))";
    svg.appendChild(p);
  };
  const f = F[i];
  if (f.b) { const a = center(f.b[0]), t = center(f.b[1]); if (a && t) add(a, t, false); }
  if (dragArrow) add(dragArrow[0], dragArrow[1], dragArrow[2]);
}

const findCard = (f, u) => { for (const s of f.s) for (const c of [s.L, ...s.C]) if (c.u === u) return c; };
function drawBattle(f) {
  const el = $("battle");
  const a = f.b && findCard(f, f.b[0]), t = f.b && findCard(f, f.b[1]);
  if (!a || !t) { el.style.display = "none"; return; }
  el.innerHTML = `<span class="${a.p >= t.p ? "win" : "lose"}">${a.p}</span><span class="vs title">vs</span><span>${t.p}</span>`;
  el.style.display = "flex";
}

// ------------------------------------------------------------------ side panel

function drawPanels(f) {
  for (const p of [0, 1]) {
    const s = f.s[p], el = $(mine(p) ? "plate0" : "plate1");
    const who = LIVE ? (p === BOT ? "You" : "Bot") : `P${p}`;
    const agent = R.players[p].agent && !(LIVE && p === BOT) ? ` · ${esc(R.players[p].agent)}` : "";
    el.innerHTML = `<span class="nm" style="color:${mine(p) ? "var(--green)" : "var(--blue)"}">${who} · ${esc(short(p))}<span style="color:var(--faint);font-weight:400;font-size:11px">${agent}</span></span>` +
      `Life <b>${s.life.length}</b> · Hand <b>${s.H.length}</b> · Deck <b>${s.deck}</b> · DON!! <b>${s.don[0]}</b>/${s.don[0] + s.don[1]}`;
    el.classList.toggle("turn", f.t > 0 && f.tp === p);
  }
  $("phase").textContent = f.t ? `Turn ${f.t} · ${f.ph.replace(/_/g, " ")}` : "Setup";
  $("ttl").textContent = LIVE ? (R.over ? "Game over" : `Seed ${R.seed}`) : `Replay · seed ${R.seed}`;
  drawPrompt(f);
  drawLog();
  drawHistory();
}

function drawLog() {
  const lines = [];
  for (let k = 0; k <= i; k++) {
    for (const l of F[k].log) {
      const m = l.replace(/^\[T\d+\] /, "");
      if (m.startsWith("---")) { lines.push(`<div class="t">${esc(m.replace(/-+/g, "").trim())}</div>`); continue; }
      const who = /^Player ([01])\b/.exec(m);
      lines.push(`<div class="l ${who ? (+who[1] === BOT ? "me" : "them") : ""} ${k === i ? "new" : ""}">${esc(m)}</div>`);
    }
  }
  const log = $("log");
  log.innerHTML = lines.join("");
  log.scrollTop = log.scrollHeight;
}

function drawHistory() {
  $("hBar").max = Math.max(0, F.length - 1);
  $("hBar").value = i;
  $("hPlay").textContent = playing ? "❚❚" : "▶";
  $("hLive").disabled = i === F.length - 1;
}

// ------------------------------------------------------------------ the player's decisions

function myMove() {
  const f = F[i];
  return !!(LIVE && !R.over && !busy && !playing && i === F.length - 1 && f && f.d && f.d.pick === null && f.d.pl === BOT);
}
function actions() {
  return myMove() ? F[i].d.act.map(([k, c, t, idx, ci, ti], n) => ({ k, c, t, idx, ci, ti, n, label: F[i].d.o[n] })) : [];
}
const onTable = u => els.has("u" + u);

/** uid -> highlight for the current decision ("can", "aim", or "ctr:<value>" for a Counter in hand). */
function interactionMarks(f) {
  const m = new Map();
  if (!myMove()) return m;
  const acts = actions();
  if (ui.mode === "attack") { for (const a of acts) if (a.k === "attack" && a.c === ui.src) m.set(a.t, "aim"); return m; }
  if (ui.mode === "don") { for (const a of acts) if (a.k === "give_don") m.set(a.t, "aim"); return m; }
  if (f.d.kind === "counter") {
    for (const a of acts) if (a.c !== null) {
      const c = f.s[BOT].H.find(x => x.u === a.c);
      m.set(a.c, a.k === "counter" && c ? "ctr:" + (c.x || C[c.i].cnt) : "can");
    }
    return m;
  }
  for (const a of acts) if (a.c !== null && a.k !== "give_don") m.set(a.c, "can");
  return m;
}

function choose(n) {
  if (!myMove()) return;
  closePop();
  hideModal();
  ui = { mode: null, src: null };
  dragArrow = null;
  act(n);
}

function drawPrompt(f) {
  const el = $("prompt"), d = f.d;
  if (!d) {
    const w = R.winner;
    el.innerHTML = `<div class="who title">Game over</div><div class="q">${w === null ? "Draw" : LIVE ? (w === BOT ? "You win!" : "You lose") : esc(short(w)) + " wins"}</div>`;
    return;
  }
  if (LIVE && !myMove()) {
    if (i < F.length - 1 && !playing) {
      el.innerHTML = `<div class="who title">History</div><div class="q">Looking back at turn ${f.t}.</div><button class="btn primary" id="toNow">Back to the game</button>`;
      $("toNow").onclick = () => go(F.length - 1);
      return;
    }
    el.innerHTML = `<div class="who title them">Opponent's turn</div><div class="q">${playing ? "The bot is playing…" : "Waiting…"}</div>` +
      (playing ? `<button class="btn" id="skipBot">Skip to my move ▸▸</button>` : "");
    const sk = $("skipBot");
    if (sk) sk.onclick = () => { stopPlayback(); go(F.length - 1); };
    return;
  }
  if (!LIVE) {
    const shown = d.o.map((o, k) => ({ o, k })).filter(({ k }) => k === d.pick || k < 6);
    el.innerHTML = `<div class="who title ${d.pl === BOT ? "me" : "them"}">P${d.pl} · ${esc(short(d.pl))}</div><div class="q">${esc(d.q || d.kind)}</div>` +
      `<div class="opts">${shown.map(({ o, k }) => `<div class="btn" style="${k === d.pick ? "border-color:var(--violet);background:rgba(185,140,255,.18);font-weight:700" : "opacity:.55"}">${esc(o)}</div>`).join("")}</div>`;
    return;
  }
  const acts = actions(), kind = d.kind;
  if (kind === "main") {
    const end = acts.find(a => a.k === "end");
    const hint = ui.mode === "attack" ? "Click a target glowing red. Esc to cancel." :
      ui.mode === "don" ? "Click one of your cards to give it DON!!. Esc to cancel." :
      "Drag a card from your hand onto the field to play it. Drag an attacker onto its target, or DON!! onto a card. Or click a glowing card.";
    el.innerHTML = `<div class="who title me">Your turn</div><div class="hint">${hint}</div>` +
      `<button class="btn primary title" id="endturn">End turn</button>${allOptions(acts)}`;
    $("endturn").onclick = () => end && choose(end.n);
    return wireOptions();
  }
  let q = d.q || kind, hint = "";
  if (kind === "counter") {
    const a = f.b && findCard(f, f.b[0]), t = f.b && findCard(f, f.b[1]);
    if (a && t) {
      q = `${C[a.i].n} (${a.p}) attacks your ${C[t.i].n} (${t.p})`;
      hint = a.p >= t.p ? `You need +${Math.ceil((a.p - t.p + 1) / 1000) * 1000} to survive. Click a glowing card in your hand to use it.`
        : "Your card survives as things stand.";
    }
  } else if (kind === "block") {
    hint = "Click a glowing Blocker to block, or let the attack through.";
  } else if (acts.some(a => a.c !== null && a.k !== "give_don")) {
    hint = "Click a glowing card.";
  }
  if (kind === "confirm") previewNamed(q);
  const plain = acts.filter(a => a.c === null && a.k !== "give_don");
  const buttons = plain.map(a => `<button class="btn ${["pass", "no"].includes(a.k) ? "" : "primary"}" data-opt="${a.n}">${esc(nice(a))}</button>`).join("");
  el.innerHTML = `<div class="who title me">Your move</div><div class="q">${esc(q)}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ""}` +
    `<div class="opts">${buttons}</div>${allOptions(acts)}`;
  wireOptions();
}

const nice = a => a.label && a.label !== a.k ? a.label : a.k[0].toUpperCase() + a.k.slice(1);

/** Show the card a prompt names ("Put Gloriosa on the bottom of your deck?"), longest name first. */
function previewNamed(text) {
  let best = null;
  for (const id in C) if (text.includes(C[id].n) && (!best || C[id].n.length > C[best].n.length)) best = id;
  if (best) preview(best);
}

function allOptions(acts) {
  return `<div class="more" id="allopts">All ${acts.length} options</div><div class="opts" id="optlist" hidden>` +
    acts.map(a => `<button class="btn" data-opt="${a.n}">${esc(nice(a))}</button>`).join("") + "</div>";
}
function wireOptions() {
  $("prompt").querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(+b.dataset.opt));
  const m = $("allopts");
  if (m) m.onclick = () => { $("optlist").hidden = !$("optlist").hidden; };
}

/** Decisions that open in the middle of the table. */
function maybeModal() {
  if (!myMove()) { if (!(R.over && i === F.length - 1)) hideModal(); return; }
  const f = F[i], d = f.d, acts = actions();
  if (d.kind === "go_first")
    return modal(`<h2 class="title">Who goes first?</h2><div class="q">You won the roll.</div>`, [],
      acts.map(a => [a.k === "first" ? "Go first" : "Go second", a.n, a.k === "first"]));
  if (d.kind === "mulligan")
    return modal(`<h2 class="title">Your opening hand</h2><div class="q">Keep it, or shuffle it back and draw 5 new cards (once).</div>`,
      f.s[BOT].H.map(c => ({ id: c.i })), acts.map(a => [a.k === "keep" ? "Keep" : "Redraw", a.n, a.k === "keep"]));
  if (d.kind === "trigger") {
    const yes = acts.find(a => a.k === "yes");
    return modal(`<h2 class="title">Trigger!</h2><div class="q">${esc(d.q)}</div>`, yes ? [{ id: yes.ci }] : [],
      acts.map(a => [a.k === "yes" ? "Activate Trigger" : "Add to hand", a.n, a.k === "yes"]));
  }
  const cardActs = acts.filter(a => a.c !== null && a.k !== "give_don");
  if (!["main", "counter", "block"].includes(d.kind) && cardActs.length && cardActs.some(a => !onTable(a.c))) {
    const head = d.kind === "order_cards" ? "Order the cards" : d.kind === "order" ? "Resolve which first?" : "Choose";
    const why = resolving();
    return modal(`<h2 class="title">${head}</h2>${why ? `<div class="q" style="color:var(--ink)">${esc(why)}</div>` : ""}<div class="q">${esc(d.q)}</div>`,
      cardActs.map(a => ({ id: a.ci, n: a.n, label: a.label })), acts.filter(a => a.c === null).map(a => [a.label || a.k, a.n, false]));
  }
  hideModal();
}

/** The effect being carried out: the latest "Card: [Timing] text" log line so far. */
function resolving() {
  for (let k = i; k >= 0; k--)
    for (let j = F[k].log.length - 1; j >= 0; j--) {
      const m = F[k].log[j].replace(/^\[T\d+\] /, "");
      if (/^[^:]+: \[/.test(m)) return m;
      if (m.startsWith("---")) return "";
    }
  return "";
}

function modal(head, cards, buttons) {
  const box = $("mbox");
  box.innerHTML = head +
    (cards.length ? `<div class="row">${cards.map(c => `<div class="pick ${c.n === undefined ? "off" : ""}" ${c.n !== undefined ? `data-opt="${c.n}"` : ""} data-id="${esc(c.id)}">` +
      `<div class="im">${esc(C[c.id] ? C[c.id].n : "")}${img(art(c.id))}</div>${c.label ? `<div>${esc(c.label)}</div>` : ""}</div>`).join("")}</div>` : "") +
    `<div class="btns">${buttons.map(([t, n, primary]) => `<button class="btn ${primary ? "primary big" : "big"}" data-opt="${n}">${esc(t)}</button>`).join("")}</div>`;
  box.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(+b.dataset.opt));
  box.querySelectorAll("[data-id]").forEach(b => b.onmouseenter = () => preview(b.dataset.id));
  $("modal").style.display = "grid";
}
function hideModal() { $("modal").style.display = "none"; }

// ------------------------------------------------------------------ clicking and dragging

function stagePoint(e) {
  const r = $("stage").getBoundingClientRect(), s = r.width / 1600;
  return [(e.clientX - r.left) / s, (e.clientY - r.top) / s];
}
function closePop() { $("pop").style.display = "none"; }

function popover(it, items) {
  const pop = $("pop");
  pop.innerHTML = items.map((x, k) => `<button class="btn ${x.primary ? "primary" : ""}" data-k="${k}">${esc(x.label)}</button>`).join("") +
    `<button class="btn" data-k="x" style="opacity:.7">Cancel</button>`;
  pop.style.display = "flex";
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let x = it.x - w / 2, y = it.zone === "hand" ? it.y - 150 - h : it.y - H * it.s / 2 - h - 14;
  if (y < 10) y = it.y + H * it.s / 2 + 16;
  pop.style.left = Math.max(330, Math.min(1270 - w, x)) + "px";
  pop.style.top = y + "px";
  pop.querySelectorAll("[data-k]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    closePop();
    if (b.dataset.k !== "x") items[+b.dataset.k].run();
  });
}

function clickCard(el) {
  const it = el._it;
  if (it.zone === "trash") return showTrash(it.p);
  if (it.don && it.p === BOT) {
    if (myMove() && !it.rested && actions().some(a => a.k === "give_don")) { ui = { mode: ui.mode === "don" ? null : "don", src: null }; render(false); }
    return;
  }
  const u = it.c ? it.c.u : null;
  if (u === null) return;
  preview(it.c.i);
  if (!myMove()) return;
  const acts = actions(), kind = F[i].d.kind;
  if (ui.mode === "attack") {
    const a = acts.find(a => a.k === "attack" && a.c === ui.src && a.t === u);
    if (a) return choose(a.n);
    if (u !== ui.src) { ui = { mode: null, src: null }; render(false); }
    return;
  }
  if (ui.mode === "don") {
    const a = acts.find(a => a.k === "give_don" && a.t === u);
    ui = { mode: null, src: null };
    return a ? choose(a.n) : render(false);
  }
  const own = acts.filter(a => a.c === u);
  const items = [];
  if (kind === "main") {
    const cost = it.c.c ?? C[it.c.i].cost;
    for (const a of own.filter(a => a.k === "play"))
      items.push({ label: `${C[it.c.i].cat === "Event" ? "Activate" : "Play"} ${C[it.c.i].n} · cost ${cost}`, primary: true, run: () => choose(a.n) });
    for (const a of own.filter(a => a.k === "activate")) items.push({ label: a.label, run: () => choose(a.n) });
    if (own.some(a => a.k === "attack")) items.push({ label: "Attack…", primary: true, run: () => { ui = { mode: "attack", src: u }; render(false); } });
    const give = acts.find(a => a.k === "give_don" && a.t === u);
    if (give) items.push({ label: "Give 1 DON!!", run: () => choose(give.n) });
  } else {
    for (const a of own) items.push({ label: a.label || a.k, primary: true, run: () => choose(a.n) });
  }
  if (!items.length) return;
  if (items.length === 1 && kind !== "main" && kind !== "counter") return items[0].run();
  popover(it, items);
}

let drag = null;
function startDrag(e, el) {
  const it = el._it;
  if (!myMove() || e.button !== 0) return;
  const acts = actions(), kind = F[i].d.kind, u = it.c ? it.c.u : null;
  let type = null;
  if (kind === "main" && it.zone === "hand" && acts.some(a => a.k === "play" && a.c === u)) type = "play";
  else if (kind === "main" && u !== null && it.zone !== "hand" && acts.some(a => a.k === "attack" && a.c === u)) type = "attack";
  else if (kind === "main" && it.don && it.p === BOT && !it.rested && acts.some(a => a.k === "give_don")) type = "don";
  if (type) drag = { type, el, it, u, start: stagePoint(e), moved: false };
}

function onMove(e) {
  if (!drag) return;
  const [x, y] = stagePoint(e);
  if (!drag.moved && Math.hypot(x - drag.start[0], y - drag.start[1]) < 7) return;
  if (!drag.moved) { drag.moved = true; closePop(); }
  if (drag.type === "play") {
    drag.el.classList.add("dragging");
    drag.el.style.transform = `translate(${x - W / 2}px, ${y - H / 2}px) scale(1.15)`;
    document.querySelector(`[data-zone="chars:${BOT}"]`).classList.toggle("drop", y < 830);
    return;
  }
  if (!drag.marked) {
    drag.marked = true;
    ui = drag.type === "attack" ? { mode: "attack", src: drag.u } : { mode: "don", src: null };
    render(false);
  }
  dragArrow = [[drag.it.x, drag.it.y], [x, y], drag.type === "don"];
  drawArrows();
}

function onUp(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  document.querySelectorAll(".zone.drop").forEach(z => z.classList.remove("drop"));
  if (!d.moved) return clickCard(d.el);
  const [x, y] = stagePoint(e);
  dragArrow = null;
  const acts = actions();
  if (d.type === "play") {
    d.el.classList.remove("dragging");
    const a = acts.find(a => a.k === "play" && a.c === d.u);
    return a && y < 830 ? choose(a.n) : render(false);
  }
  const hit = cardAt(x, y), u = hit && hit._it.c ? hit._it.c.u : null;
  const a = d.type === "attack" ? acts.find(a => a.k === "attack" && a.c === d.u && a.t === u) : acts.find(a => a.k === "give_don" && a.t === u);
  ui = { mode: null, src: null };
  return a ? choose(a.n) : render(false);
}

function cardAt(x, y) {
  let best = null;
  for (const el of els.values()) {
    const it = el._it;
    if (!it.c || it.zone === "hand") continue;
    const w = (it.c.r ? H : W) * it.s / 2 + 8, h = (it.c.r ? W : H) * it.s / 2 + 8;
    if (Math.abs(x - it.x) <= w && Math.abs(y - it.y) <= h) best = el;
  }
  return best;
}

// ------------------------------------------------------------------ card preview

function preview(id) {
  if (!id || !C[id]) return;
  const d = C[id], src = art(id);
  $("pvImg").innerHTML = src ? img(src) : `<div style="padding:16px;color:#222;background:#f2eee4;width:100%;height:100%;font-weight:700">${esc(d.n)}</div>`;
  const stats = [d.cat, d.col.map(c => c[0].toUpperCase() + c.slice(1)).join("/"), d.cat === "Leader" ? `Life ${d.life}` : `Cost ${d.cost}`];
  if (d.pow) stats.push(`${d.pow} power`);
  if (d.cnt) stats.push(`Counter +${d.cnt}`);
  $("pvInfo").innerHTML = `<h3>${esc(d.n)}</h3><div class="meta">${esc(id)} · ${esc(stats.join(" · "))}${d.ty.length ? "<br>" + esc(d.ty.join(" / ")) : ""}</div>` +
    (d.txt ? `<p>${esc(d.txt)}</p>` : "") + (d.trg ? `<p>${esc(d.trg)}</p>` : "") +
    (d.un && d.un.length ? `<p class="un">Not implemented: ${esc(d.un.join(" / "))}</p>` : "");
}

function showTrash(p) {
  const t = F[i].s[p].trash;
  modal(`<h2 class="title">${LIVE ? (p === BOT ? "Your" : "Opponent's") : "P" + p} trash · ${t.length}</h2>`, t.slice().reverse().map(id => ({ id })), [["Close", -1, true]]);
  $("mbox").querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { hideModal(); maybeModal(); });
}

// ------------------------------------------------------------------ moving through the game

function go(k, animate = true) {
  i = Math.max(0, Math.min(F.length - 1, k));
  ui = { mode: null, src: null };
  closePop();
  const turnChanged = shownFrame && shownFrame.t !== F[i].t && F[i].t > 0;
  render(animate);
  if (turnChanged && animate) banner(LIVE ? (F[i].tp === BOT ? "Your turn" : "Opponent's turn") : `Turn ${F[i].t}`);
  maybeModal();
  if (LIVE && R.over && i === F.length - 1 && !playing) gameOver();
}

function banner(text) {
  const b = $("banner");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove("show"), 1100);
}

function toast(lines) {
  const text = lines.map(l => l.replace(/^\[T\d+\] /, "")).filter(l => !l.startsWith("---")).slice(-2).join(" · ");
  if (!text) return;
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 1600);
}

const quiet = k => F[k].log.length === 0 && !F[k].b;
function playFrom(k, end, speed = 750) {
  stopPlayback();
  playing = { k, end };
  const tick = () => {
    if (!playing) return;
    if (playing.k > playing.end) { playing = null; go(i, false); return; }
    const k = playing.k++;
    go(k);
    if (F[k].log.length) toast(F[k].log);
    timer = setTimeout(tick, quiet(k) ? 120 : speed);
  };
  tick();
}
function stopPlayback() { clearTimeout(timer); playing = null; }
function togglePlay() {
  if (playing) { stopPlayback(); drawHistory(); drawPrompt(F[i]); }
  else if (i < F.length - 1) playFrom(i + 1, F.length - 1, LIVE ? 750 : 1000);
}

// ------------------------------------------------------------------ live play

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function apply(st, watch) {
  F.splice(st.from, F.length - st.from, ...st.frames);
  Object.assign(R, { winner: st.winner, turns: st.turns, first: st.first, over: st.over });
  $("liveBtns").hidden = false;
  $("concede").hidden = !!R.over;
  const first = st.from + 1;
  if (watch && F.length - 1 > first) playFrom(first, F.length - 1);   // the bot's moves, one by one
  else go(F.length - 1);
}

async function act(n) {
  if (busy) return;
  busy = true;
  render(false);
  try { apply(await api("/api/act", { frame: i, option: n }), true); }
  finally { busy = false; if (!playing) { render(false); maybeModal(); } }
}

function gameOver() {
  const w = R.winner;
  modal(`<h2 class="title" style="font-size:56px;color:${w === BOT ? "var(--gold)" : "#ff9a9a"}">${w === null ? "Draw" : w === BOT ? "Victory" : "Defeat"}</h2>` +
    `<div class="q">After ${R.turns} turns. Use the timeline on the right to step back through the game.</div>`, [],
    [["New game", -2, true], ["Review the game", -3, false]]);
  $("mbox").querySelectorAll("[data-opt]").forEach(b => b.onclick = async () => {
    hideModal();
    if (+b.dataset.opt === -2) { await api("/api/new", {}); location.reload(); }
  });
}

// ------------------------------------------------------------------ start

function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 1000);
  $("stage").style.transform = `translate(${(innerWidth - 1600 * s) / 2}px, ${(innerHeight - 1000 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fit);

$("cards").addEventListener("pointerdown", e => {
  const el = e.target.closest(".card");
  if (!el || !el._it) return;
  startDrag(e, el);
  if (!drag) clickCard(el);
});
addEventListener("pointermove", onMove);
addEventListener("pointerup", onUp);
$("cards").addEventListener("mouseover", e => {
  const el = e.target.closest(".card");
  if (!el || !el._it || el._it.back || el._it.don || el._it.donback || el._it.empty) return;
  preview(el._it.c ? el._it.c.i : el._it.id);
});
$("stage").addEventListener("pointerdown", e => {
  if (!e.target.closest(".card, #pop, #side, #modal, #preview") && (ui.mode || $("pop").style.display === "flex")) {
    ui = { mode: null, src: null };
    closePop();
    render(false);
  }
});
addEventListener("keydown", e => {
  if (e.key === "Escape") { ui = { mode: null, src: null }; closePop(); render(false); return; }
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  const k = { ArrowLeft: () => { stopPlayback(); go(i - 1, false); }, ArrowRight: () => { stopPlayback(); go(i + 1); },
    End: () => { stopPlayback(); go(F.length - 1); }, " ": togglePlay }[e.key];
  if (k) { e.preventDefault(); k(); }
});
$("hBack").onclick = () => { stopPlayback(); go(i - 1, false); };
$("hFwd").onclick = () => { stopPlayback(); go(i + 1); };
$("hPlay").onclick = togglePlay;
$("hLive").onclick = () => { stopPlayback(); go(F.length - 1); };
$("hBar").oninput = e => { stopPlayback(); go(+e.target.value, false); };
$("concede").onclick = async () => { if (confirm("Concede this game?")) apply(await api("/api/concede", {}), false); };
$("newgame").onclick = async () => { if (R.over || confirm("Abandon this game and start a new one?")) { await api("/api/new", {}); location.reload(); } };

if (A && A.table) $("backdrop").style.setProperty("--table", `url('${asset(A.table)}')`);
if (A) for (const id in A.cards) new Image().src = art(id);
document.title = LIVE ? "OPTCG · Play" : "OPTCG · Replay";
fit();
drawZones();
if (LIVE) api("/api/state?from=0").then(st => apply(st, false));
else go(0, false);
</script>
</body>
</html>
