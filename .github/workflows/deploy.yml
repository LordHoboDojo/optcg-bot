# When CI passes on main: builds the image, pushes it to GHCR and puts it live on the server.
# Run it by hand with a commit's SHA to go back to that commit. See docs/hosting.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the commit to deploy (its image must already be built)
        required: true

permissions:
  contents: read
  packages: write

# One at a time, and never cancelled halfway through
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lordhobodojo/optcg-bot
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}

jobs:
  deploy:
    # workflow_run has the deploy secrets, and pull requests from forks run CI too: only a push
    # to this repository counts
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check the commit
        run: echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        if: github.event_name == 'workflow_run'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "${DEPLOY_HOST#*@}" "${DEPLOY_HOST%@*}" > ~/.ssh/config
      - name: Copy the compose file and the deploy script
        run: |
          scp docker-compose.yml server:optcg/
          scp deploy/Caddyfile deploy/deploy.sh server:optcg/deploy/
      - name: Put it live
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh server docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ssh server "optcg/deploy/deploy.sh $SHA"
      - name: Forget the registry login
        if: always()
        run: ssh server docker logout ghcr.io || true
      - name: Move latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$SHA"
