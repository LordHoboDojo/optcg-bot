# Checks every pull request and every push to main: the Python tests (with PyTorch and the
# Rust engine, so nothing is skipped but the card-art test), the Rust tests, the React site
# and the Docker image. Nothing is deployed from here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - name: Install dependencies
        # torch from PyTorch's CPU-only index (as in the Dockerfile); its dependencies from PyPI
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple "torch==2.14.1"
          pip install -r requirements-server.txt "maturin>=1.5,<2.0"
      - name: Build the Rust engine
        run: |
          maturin build --release -m engine-rs/Cargo.toml -o dist
          pip install dist/*.whl
      - name: Run the tests
        run: python -m unittest discover tests -v

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      # Also builds the examples (bench, coverage, fuzz, ...)
      - run: cargo test --release

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Typechecks (tsc -b) before bundling
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
